name: Test and Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        
      - name: Validate HTML Syntax
        run: echo "Pretending to run an HTML Linter here... looks good!"
        
      - name: Test Docker Build
        run: docker build -t test-website-build .

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and Deploy with ZERO DOWNTIME
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            cd ~/docker/Docker_learn
            git pull origin main
            
            sudo docker build -t my-live-website .
            
            sudo docker rm -f traefik website-blue website-green production-web || true
            sudo docker run -d -p 80:80 --name production-web my-live-website

  # JOB 3: PROFESSIONAL EMAIL NOTIFICATIONS
  notify:
    needs: [test, deploy]
    if: always()
    runs-on: ubuntu-latest

    steps:
      # SUCCESS EMAIL
      - name: Send Success Email
        if: ${{ needs.test.result == 'success' && needs.deploy.result == 'success' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          to: ${{ secrets.EMAIL_USERNAME }}
          from: "Vividhan Tech <${{ secrets.EMAIL_USERNAME }}>"
          subject: "✅ Deployment Successful | Vividhan Tech"

          html_body: |
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <meta name="color-scheme" content="light">
              <title>Deployment Successful</title>
            </head>
            <body style="margin:0;padding:0;background-color:#f1f4f9;font-family:Arial,Helvetica,sans-serif;color:#172033;">

              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f1f4f9;">
                <tr>
                  <td align="center" style="padding:36px 12px;">

                    <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:600px;background:#ffffff;border:1px solid #e4e9f2;border-radius:14px;overflow:hidden;">

                      <!-- BRAND HEADER -->
                      <tr>
                        <td style="padding:25px 30px;background:#080d1b;">
                          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                            <tr>
                              <td>
                                <span style="display:inline-block;padding:8px 10px;border:1px solid #354774;border-radius:8px;color:#a7baff;font-size:14px;font-weight:bold;">&lt;/&gt;</span>
                                <span style="padding-left:9px;color:#ffffff;font-size:19px;font-weight:bold;vertical-align:middle;">Vividhan<span style="color:#8ea5ff;">Tech</span></span>
                              </td>
                              <td align="right" style="color:#aab6ce;font-size:11px;">ENGINEERING AUTOMATION</td>
                            </tr>
                          </table>
                        </td>
                      </tr>

                      <!-- SUCCESS HERO -->
                      <tr>
                        <td align="center" style="padding:37px 28px 30px;">
                          <div style="display:inline-block;padding:9px 15px;background:#eaf9f0;border:1px solid #c6efd5;border-radius:30px;color:#16834b;font-size:12px;font-weight:bold;letter-spacing:1px;">
                            &#10003; &nbsp; DEPLOYMENT COMPLETE
                          </div>

                          <h1 style="margin:22px 0 12px;color:#10192d;font-size:30px;line-height:1.25;letter-spacing:-0.8px;">
                            Your website is deployed.
                          </h1>

                          <p style="max-width:450px;margin:0;color:#657189;font-size:15px;line-height:1.8;">
