                            <tr>
                              <td style="padding:14px 18px;color:#657189;font-size:13px;border-bottom:1px solid #edf0f5;">HTML validation step</td>
                              <td align="right" style="padding:14px 18px;color:#16834b;font-size:12px;font-weight:bold;border-bottom:1px solid #edf0f5;">&#10003; Passed*</td>
                            </tr>
                            <tr>
                              <td style="padding:14px 18px;color:#657189;font-size:13px;border-bottom:1px solid #edf0f5;">Docker image build</td>
                              <td align="right" style="padding:14px 18px;color:#16834b;font-size:12px;font-weight:bold;border-bottom:1px solid #edf0f5;">&#10003; Passed</td>
                            </tr>
                            <tr>
                              <td style="padding:14px 18px;color:#657189;font-size:13px;">EC2 deployment job</td>
