                          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border:1px solid #e5eaf2;border-radius:10px;">
                            <tr>
                              <td colspan="2" style="padding:16px 18px;background:#f8faff;border-bottom:1px solid #e5eaf2;">
                                <span style="color:#172033;font-size:14px;font-weight:bold;">Failed workflow details</span>
                              </td>
                            </tr>
                            <tr>
                              <td style="padding:12px 18px;color:#657189;font-size:12px;border-bottom:1px solid #edf0f5;">Repository</td>
                              <td align="right" style="padding:12px 18px;color:#172033;font-size:12px;font-weight:bold;overflow-wrap:anywhere;">${{ github.repository }}</td>
