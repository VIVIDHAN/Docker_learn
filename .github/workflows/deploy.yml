name: Test and Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        
      - name: Validate HTML Syntax
        run: echo "Pretending to run an HTML Linter here... looks good!"
        
      - name: Test Docker Build
        run: docker build -t test-website-build .

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and Deploy with ZERO DOWNTIME
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            cd ~/docker/Docker_learn
            git pull origin main
            
            sudo docker build -t my-live-website .
            
            if ! sudo docker ps | grep -q traefik; then
              sudo docker rm -f production-web traefik || true
              sudo docker run -d -p 80:80 --name traefik -v /var/run/docker.sock:/var/run/docker.sock traefik:v3.0 --providers.docker=true
            fi
            
            if sudo docker ps | grep -q website-blue; then
              OLD="website-blue"
              NEW="website-green"
            else
              OLD="website-green"
              NEW="website-blue"
            fi
            
            sudo docker run -d --name $NEW --label "traefik.http.routers.$NEW.rule=PathPrefix(\`/\`)" my-live-website
            
            sleep 3
            
            sudo docker rm -f $OLD || true

  # JOB 3: EMAIL NOTIFICATIONS
  notify:
    needs: [test, deploy]
    if: always() # This ensures the email sends even if the test or deploy fails!
    runs-on: ubuntu-latest
    steps:
      - name: Send Success Email
        if: ${{ needs.test.result == 'success' && needs.deploy.result == 'success' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ Deployment Successful: Docker_learn"
          to: ${{ secrets.EMAIL_USERNAME }}
          from: "Vividhan CI/CD Bot"
          html_body: |
            <div style="font-family: Arial, sans-serif; padding: 30px; border-radius: 10px; max-width: 600px; margin: 0 auto; text-align: center; background-color: #f9f9f9; border: 1px solid #e0e0e0;">
              <h1 style="color: #2ecc71; margin-bottom: 5px;">🚀 Deployment Successful!</h1>
              <p style="color: #555; font-size: 16px; margin-bottom: 25px;">Great news! Your latest code has been successfully built and deployed to your AWS EC2 server with Zero Downtime.</p>
              <a href="http://13.235.69.194" style="background-color: #3498db; color: white; padding: 12px 25px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block;">View Live Website</a>
              <br><br><hr style="border: none; border-top: 1px solid #ddd; margin: 20px 0;"><br>
              <p style="font-size: 12px; color: #aaa;">Automated by GitHub Actions & Docker</p>
            </div>

      - name: Send Failure Email
        if: ${{ needs.test.result == 'failure' || needs.deploy.result == 'failure' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ Deployment FAILED: Docker_learn"
          to: ${{ secrets.EMAIL_USERNAME }}
          from: "Vividhan CI/CD Bot"
          html_body: |
            <div style="font-family: Arial, sans-serif; padding: 30px; border-radius: 10px; max-width: 600px; margin: 0 auto; text-align: center; background-color: #fdf2f2; border: 1px solid #f5c6cb; border-top: 5px solid #e74c3c;">
              <h1 style="color: #e74c3c; margin-bottom: 5px;">⚠️ Deployment Failed</h1>
              <p style="color: #555; font-size: 16px; margin-bottom: 25px;">Oh no! Something went wrong during the build or deployment process. <b>Your live website is safe and has not been changed.</b></p>
              <a href="https://github.com/VIVIDHAN/Docker_learn/actions" style="background-color: #e74c3c; color: white; padding: 12px 25px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block;">Check Error Logs</a>
              <br><br><hr style="border: none; border-top: 1px solid #f5c6cb; margin: 20px 0;"><br>
              <p style="font-size: 12px; color: #aaa;">Automated by GitHub Actions & Docker</p>
            </div>
