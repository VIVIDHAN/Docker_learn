                            <tr>
                              <td style="padding:17px;">
                                <p style="margin:0 0 7px;color:#965510;font-size:13px;font-weight:bold;">Live site status is unverified</p>
                                <p style="margin:0;color:#855e30;font-size:12px;line-height:1.8;">
                                  The deployment script removes existing containers before starting the replacement.
                                  If deployment fails during that process, the website may be unavailable.
                                  Check the live site and server before assuming it is healthy.
