                            </tr>
                          </table>
                          <p style="margin:8px 0 0;color:#8b95a7;font-size:10px;line-height:1.6;">*Your current HTML validation step is a placeholder command, not a real HTML linter.</p>
                        </td>
                      </tr>

                      <!-- RUN DETAILS -->
                      <tr>
                        <td style="padding:0 25px 28px;">
                          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f7f9fc;border-radius:10px;">
                            <tr>
                              <td style="padding:18px;">
                                <p style="margin:0 0 13px;color:#172033;font-size:13px;font-weight:bold;">Deployment details</p>
                                <p style="margin:8px 0;color:#657189;font-size:12px;">Repository: <strong style="color:#172033;">${{ github.repository }}</strong></p>
                                <p style="margin:8px 0;color:#657189;font-size:12px;">Branch: <strong style="color:#172033;">${{ github.ref_name }}</strong></p>
                                <p style="margin:8px 0;color:#657189;font-size:12px;">Triggered by: <strong style="color:#172033;">${{ github.actor }}</strong></p>
                                <p style="margin:8px 0;color:#657189;font-size:12px;">Commit: <strong style="color:#172033;">${{ github.sha }}</strong></p>
                                <p style="margin:8px 0;color:#657189;font-size:12px;">Run number: <strong style="color:#172033;">#${{ github.run_number }}</strong></p>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>

                      <!-- FOOTER -->
                      <tr>
                        <td align="center" style="padding:23px 25px;background:#080d1b;">
                          <p style="margin:0 0 12px;color:#ffffff;font-size:13px;font-weight:bold;">Built with automation. Delivered with confidence.</p>
                          <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" style="color:#a7baff;font-size:12px;text-decoration:underline;">View workflow run</a>
                          <p style="margin:17px 0 0;color:#8290aa;font-size:10px;line-height:1.7;">Automated notification from GitHub Actions<br>Vividhan Tech &copy; 2026</p>
                        </td>
                      </tr>

                    </table>
                  </td>
                </tr>
              </table>
            </body>
            </html>

      # FAILURE EMAIL
      - name: Send Failure Email
        if: ${{ needs.test.result == 'failure' || needs.deploy.result == 'failure' || needs.test.result == 'cancelled' || needs.deploy.result == 'cancelled' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          to: ${{ secrets.EMAIL_USERNAME }}
          from: "Vividhan Tech <${{ secrets.EMAIL_USERNAME }}>"
          subject: "🚨 Deployment Failed | Vividhan Tech"

          html_body: |
            <!DOCTYPE html>
            <html lang="en">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <meta name="color-scheme" content="light">
              <title>Deployment Failed</title>
            </head>
            <body style="margin:0;padding:0;background:#f1f4f9;font-family:Arial,Helvetica,sans-serif;color:#172033;">

              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f1f4f9;">
                <tr>
                  <td align="center" style="padding:36px 12px;">

                    <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:600px;background:#ffffff;border:1px solid #e4e9f2;border-radius:14px;overflow:hidden;">

                      <!-- BRAND HEADER -->
                      <tr>
                        <td style="padding:25px 30px;background:#080d1b;">
                          <span style="display:inline-block;padding:8px 10px;border:1px solid #354774;border-radius:8px;color:#a7baff;font-size:14px;font-weight:bold;">&lt;/&gt;</span>
                          <span style="padding-left:9px;color:#ffffff;font-size:19px;font-weight:bold;vertical-align:middle;">Vividhan<span style="color:#8ea5ff;">Tech</span></span>
                          <span style="float:right;color:#aab6ce;font-size:11px;">CI/CD ALERT</span>
                        </td>
                      </tr>

                      <!-- FAILURE HERO -->
                      <tr>
                        <td align="center" style="padding:37px 28px 25px;">
                          <div style="display:inline-block;padding:9px 15px;background:#fff0f0;border:1px solid #f6cece;border-radius:30px;color:#c52c35;font-size:12px;font-weight:bold;letter-spacing:1px;">
                            &#9888; &nbsp; ACTION REQUIRED
