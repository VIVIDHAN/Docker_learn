name: Test and Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  # JOB 1: THE TESTING PHASE
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        
      - name: Validate HTML Syntax
        run: echo "Pretending to run an HTML Linter here... looks good!"
        
      - name: Test Docker Build
        # This tries to build the image inside GitHub's temporary server.
        # If your Dockerfile has a typo, this step fails, and it NEVER reaches your real server!
        run: docker build -t test-website-build .

  # JOB 2: THE DEPLOYMENT PHASE
  deploy:
    needs: test  # <--- THIS IS THE MAGIC LINE. It tells GitHub to wait for 'test' to finish successfully.
    runs-on: ubuntu-latest
    steps:
      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            cd ~/Docker_learn
            git pull origin main
            sudo docker build -t my-live-website .
            sudo docker rm -f production-web || true
            sudo docker run -d -p 80:80 --name production-web my-live-website
