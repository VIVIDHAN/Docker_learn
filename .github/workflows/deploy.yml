                      <tr>
                        <td align="center" style="padding:0 25px 32px;">
                          <a href="http://13.235.69.194" style="display:inline-block;padding:15px 25px;background:#617df5;border-radius:8px;color:#ffffff;text-decoration:none;font-size:14px;font-weight:bold;">
                            Visit Live Website &nbsp; &#8599;
                          </a>
                          <p style="margin:13px 0 0;color:#8792a7;font-size:11px;">
                            Opens your configured website endpoint
                          </p>
                        </td>
                      </tr>

                      <!-- PIPELINE SUMMARY -->
                      <tr>
                        <td style="padding:0 25px 24px;">
                          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="border:1px solid #e5eaf2;border-radius:10px;">
